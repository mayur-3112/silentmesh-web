const NS='http://www.w3.org/2000/svg';
const $=i=>document.getElementById(i);
const E=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const Gp=(p,id,a)=>E('g',Object.assign(id?{id}:{},a||{}),p);
const Rc=(p,x,y,w,h,c='o f2',rx=2)=>E('rect',{x,y,width:w,height:h,rx,class:c},p);
const Tx=(p,x,y,s,c='tx',an='start',sz)=>{const e=E('text',{x,y,class:c,'text-anchor':an},p);if(sz)e.setAttribute('font-size',sz);e.textContent=s;return e};
const Ln=(p,x1,y1,x2,y2,c='o')=>E('line',{x1,y1,x2,y2,class:c},p);
const Pl=(p,pts,c='o')=>E('polyline',{points:pts.map(q=>q.join(',')).join(' '),class:c+' f0'},p);
const Ci=(p,cx,cy,r,c='o f2')=>E('circle',{cx,cy,r,class:c},p);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=v=>{v=clamp(v);return v*v*(3-2*v)};
const win=(t,a,b)=>sm((t-a)/(b-a));
const pulse=(t,a,b,f=.6)=>win(t,a,a+f)*(1-win(t,b-f,b));
const lerp=(a,b,k)=>a+(b-a)*k;
function along(pts,p){let L=[],tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(d);tot+=d}
 let d=clamp(p)*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i==L.length-1){const k=L[i]?d/L[i]:0;return[lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k)]}d-=L[i]}}
const elbow=(a,b)=>{const m=(a[1]+b[1])/2;return[a,[a[0],m],[b[0],m],b]};
const rev=a=>a.slice().reverse();

const W=$('world'),REG={};

 [y1-34,y2].forEach(yy=>{Rc(g,x-10,yy,46,34,'o f2',2);for(let i=0;i<3;i++)Rc(g,x-10+i*17,yy-8,12,8,'o f2',1)});
 Rc(g,x-30,568,86,104,'o f1',4);Rc(g,x-8,590,42,60,'o f2',2);Ln(g,x+13,590,x+13,650,'o thin');
 Tx(g,x+13,y1-50,label,'lb','middle',17);return g}

 else if(at(t,87,94.5))f=['acr'];else if(at(t,95.3,102.5))f=['ch'+Math.min(4,Math.floor((t-95.3)/1.3))];
 else if(at(t,102.6,110.5))f=['sm'];else if(at(t,123.8,126.5))f=['stbig'];else if(at(t,126.5,128))f=['sm'];
 else if(at(t,128,142.6)){f=['pc'+Math.min(7,Math.floor((t-128)/1.7))]}else if(t>=143.5)f=['endlive'];
 }
 setFocus(f);
}
window.setTime=setTime;

const xr=$('xray');XL.forEach(x=>{const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>{XSEL=x[1];$('explain').textContent=x[2];[...xr.children].forEach(c=>c.classList.toggle('on',c==b));setTime(T)};xr.appendChild(b)});
$('xb').onclick=()=>{XR=!XR;$('xb').classList.toggle('on',XR);xr.classList.toggle('show',XR);if(XR){playing=false;$('play').textContent='play';$('explain').textContent='pick a layer'}else{XSEL=null;$('explain').textContent=''}setTime(T)};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'pause':'play'};$('restart').onclick=()=>{T=0;playing=true;$('play').textContent='pause'};
let last=0;function loop(ts){if(!window.__manual){if(playing){T+=(ts-last)/1000;if(T>TOTAL+2)T=0}last=ts;setTime(T)}requestAnimationFrame(loop)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{setTime(0);requestAnimationFrame(ts=>{last=ts;loop(ts)})});
